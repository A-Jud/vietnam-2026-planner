<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://unpkg.com https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://www.googleapis.com https://nominatim.openstreetmap.org; frame-src https://maps.google.com https://www.google.com; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>מתכנן טיולים חכם</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services for Drive Sync -->
    <script async defer src="https://accounts.google.com/gsi/client" onload="initGIS()"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; overflow: hidden; background-color: #f8fafc; }
        #app-container { display: flex; height: 100dvh; width: 100vw; overflow: hidden; flex-direction: row-reverse; }
        #map-container { flex: 1; height: 100%; position: relative; z-index: 1; }
        #itinerary-container { width: 55vw; min-width: 400px; max-width: 100vw; height: 100%; background: white; box-shadow: -4px 0 15px rgba(0,0,0,0.05); z-index: 10; display: flex; flex-direction: column; position: relative; min-height: 0; overflow: hidden; }
        #resizer { background-color: #e2e8f0; display: flex; align-items: center; justify-content: center; z-index: 20; transition: background-color 0.2s; flex-shrink: 0; cursor: col-resize; width: 12px; }
        #resizer:active { background-color: #94a3b8; }
        .resizer-line { background: white; border-radius: 2px; width: 2px; height: 20px; margin: 2px 0; }
